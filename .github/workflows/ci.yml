# AI 生成 / 辅助创作：DeepSeek V4.1 Flash（未人工审查）
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: verify nb-package-index
        run: |
          git clone --depth 1 --branch package-format https://github.com/nbprime-team/nb-package-index.git /tmp/index
          python -m nb_pkg verify /tmp/index
